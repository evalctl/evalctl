name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Compile check
        run: python -m compileall evalctl tests

  queue-integration:
    # The fake spoolctl fixture is written from evalctl's own expectations, so
    # it cannot notice when the real tool's contract moves. This job runs the
    # queued path against the published binary instead.
    name: Queued runs against real spoolctl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The oldest supported runtime, where an incompatibility is most
          # likely to surface first.
          python-version: "3.11"
      - name: Install pinned spoolctl
        # A pinned version, and deliberately no separate hash pin: PyPI
        # publishes only this release and one alpha, so the version is
        # unambiguous, and a checksum store with no documented refresh path
        # would rot. The absent checksum is a decision, not an oversight.
        run: python -m pip install --disable-pip-version-check 'spoolctl==0.4.11'
      - name: Record spoolctl under test
        # So a CI log states what the run actually proved, not merely that it ran.
        run: spoolctl capabilities --json
      - name: Real-spoolctl queued run tests
        # EVALCTL_REQUIRE_REAL_SPOOLCTL turns a missing or below-floor binary
        # into a hard failure at import. Without it this job could report
        # success while skipping every test it exists to run, which is the
        # original blind spot in a form that looks green.
        env:
          EVALCTL_REQUIRE_REAL_SPOOLCTL: "1"
        run: python -m unittest tests.test_real_spoolctl -v

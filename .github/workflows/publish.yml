name: Publish

# Publishes to PyPI via trusted publishing (OIDC). No API token is stored in
# the repo or in Actions secrets; PyPI verifies the workflow identity directly.
#
# Requires a trusted publisher on pypi.org for the evalctl project:
#   owner: evalctl, repo: evalctl, workflow: publish.yml
# Set the environment below only if the publisher is scoped to one.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to build and publish
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check version matches the tag
        run: |
          TAG="${{ github.event.inputs.ref || github.ref_name }}"
          WHEEL_VERSION="$(ls dist/*.whl | sed -E 's/.*evalctl-([^-]+)-py3.*/\1/')"
          if [ "$TAG" != "v${WHEEL_VERSION}" ]; then
            echo "Tag ${TAG} does not match built version ${WHEEL_VERSION}" >&2
            exit 1
          fi
          echo "Publishing evalctl ${WHEEL_VERSION} from ${TAG}"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

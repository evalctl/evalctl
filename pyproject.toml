[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalctl"
version = "0.4.2"
description = "Local-first evals for agents, not just prompts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "evalctl contributors"}]
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://evalctl.dev"
Repository = "https://github.com/evalctl/evalctl"
Issues = "https://github.com/evalctl/evalctl/issues"
Changelog = "https://github.com/evalctl/evalctl/blob/main/CHANGELOG.md"

[project.scripts]
evalctl = "evalctl.cli:main"

[project.optional-dependencies]
dev = [
  "coverage>=7",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["evalctl"]

[tool.coverage.report]
show_missing = true

[tool.setuptools.packages.find]
include = ["evalctl*"]
